{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-md border border-slate-200">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-800">Welcome Back to SivunoLink</h2>
        <p class="text-sm text-slate-500 mt-2">Please log in to access your dashboard.</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition">
        </div>

        <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-2.5 rounded-lg transition shadow-sm">
            Log In
        </button>
    </form>
    
    <div class="mt-6 text-center text-sm text-slate-500">
        Don't have an account? <a href="{% url 'register' %}" class="text-green-700 font-semibold hover:underline">Register here</a>
    </div>
</div>
{% endblock %}
