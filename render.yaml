databases:
  - name: sivunolink-db
    databaseName: sivunolink
    user: sivunolink_user

services:
  - type: web
    name: sivunolink-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sivunolink_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sivunolink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4