{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg border border-slate-200 text-center">
    <h2 class="text-2xl font-bold mb-2">Secure Payment Gateway</h2>
    <p class="text-sm text-slate-500 mb-6">Amount: <strong>E{{ order.total_amount }}</strong> via {{ payment.method }}</p>
    
    <div class="bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200">
        <p class="text-xs text-slate-500 uppercase">Reference</p>
        <p class="font-mono font-bold">{{ payment.reference }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" name="action" value="success" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg mb-3 shadow-md">
            Simulate Successful Payment
        </button>
        <button type="submit" name="action" value="fail" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-lg border border-red-200">
            Cancel / Fail Payment
        </button>
    </form>
</div>
{% endblock %}
