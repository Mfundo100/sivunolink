{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-2xl font-bold mb-4">Commission Settings</h2>
    
    <form method="POST">
        {% csrf_token %}
        <label class="block text-sm font-bold text-slate-700 mb-2">Platform Commission Rate (%)</label>
        <input type="number" step="0.01" name="commission_rate" value="{{ setting.commission_rate }}" required class="w-full px-4 py-2 border border-slate-300 rounded-lg mb-6">
        <button type="submit" class="w-full bg-green-700 text-white font-bold py-2 rounded-lg">Update Rate</button>
    </form>
</div>
{% endblock %}
