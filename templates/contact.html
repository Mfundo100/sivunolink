{% extends 'base.html' %}
{% block content %}
<div class="max-w-5xl mx-auto mt-12 bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
    <div class="md:w-1/2 p-10">
        <h2 class="text-3xl font-bold text-slate-900 mb-4">Contact SivunoLink</h2>
        <p class="text-slate-500 mb-6">Have questions? Reach out to our support team.</p>
        <form class="space-y-4">
            <input type="text" placeholder="Your Name" class="w-full px-4 py-2 border rounded-lg">
            <input type="email" placeholder="Your Email" class="w-full px-4 py-2 border rounded-lg">
            <textarea placeholder="Your Message" class="w-full px-4 py-2 border rounded-lg"></textarea>
            <button type="button" class="bg-green-700 text-white px-6 py-2 rounded-lg font-bold">Send Message</button>
        </form>
    </div>
    <div class="md:w-1/2 bg-slate-100 min-h-[400px]">
        <!-- Google Maps Iframe (No API Key needed for this) -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14462.211805954484!2d31.1333!3d-26.3167!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ee8b20c2c1b69d9%3A0x6b8c9f0e0c0b0b0b!2sManzini%2C%20Eswatini!5e0!3m2!1sen!2sza!4v1620000000000!5m2!1sen!2sza" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<!-- Sponsors / Partners -->
<div class="max-w-5xl mx-auto mt-16 text-center">
    <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6">Supported By</p>
    <div class="flex justify-center gap-12 opacity-50 grayscale">
        <h3 class="text-2xl font-bold">MTN MoMo</h3>
        <h3 class="text-2xl font-bold">Eswatini Mobile</h3>
        <h3 class="text-2xl font-bold">Ministry of Agri</h3>
    </div>
</div>
{% endblock %}
